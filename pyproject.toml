[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monitorglow"
version = "1.2.0"
description = "Offline-first cross-platform display and brightness manager"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "PyQt5>=5.15.7,<6",
  "screen-brightness-control>=0.27,<0.28",
  "cryptography>=50,<51",
  "qrcode>=7.4.2,<9",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<3",
  "pip-audit>=2.7,<3",
]
build = [
  "pyinstaller>=6.10,<7",
]

[tool.setuptools]
py-modules = ["monitor_glow", "resources_rc"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "config*", "dialogs*"]
exclude = ["assets*", "tests*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["resources_rc.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["core", "config"]
omit = ["resources_rc.py"]
